<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="asset/css/style.css">
</head>

<body>
    <!-- Contenedor principal de la calculadora -->
    <div class="calculadora">
        <!-- Pantalla donde se mostrarán los números y resultados -->
        <div class="pantalla" id="pantalla">0</div>

        <!-- Contenedor de todos los botones de la calculadora -->
        <div class="botones">
            <!-- Fila 1: Botones de control y operaciones -->
            <button class="limpiar" onclick="limpiar()">C</button> <!-- Botón para limpiar todo -->
            <button class="operador" onclick="borrarUltimo()">←</button> <!-- Botón para borrar el último dígito -->
            <button class="operador" onclick="setOperacion('/')">÷</button> <!-- Botón para división -->
            <button class="operador" onclick="setOperacion('*')">×</button> <!-- Botón para multiplicación -->

            <!-- Fila 2: Números 7-9 y resta -->
            <button class="numero" onclick="agregarDigito('7')">7</button> <!-- Botón para el número 7 -->
            <button class="numero" onclick="agregarDigito('8')">8</button> <!-- Botón para el número 8 -->
            <button class="numero" onclick="agregarDigito('9')">9</button> <!-- Botón para el número 9 -->
            <button class="operador" onclick="setOperacion('-')">−</button> <!-- Botón para resta -->

            <!-- Fila 3: Números 4-6 y suma -->
            <button class="numero" onclick="agregarDigito('4')">4</button> <!-- Botón para el número 4 -->
            <button class="numero" onclick="agregarDigito('5')">5</button> <!-- Botón para el número 5 -->
            <button class="numero" onclick="agregarDigito('6')">6</button> <!-- Botón para el número 6 -->
            <button class="operador" onclick="setOperacion('+')">+</button> <!-- Botón para suma -->

            <!-- Fila 4: Números 1-3 y botón igual (que ocupa dos filas) -->
            <button class="numero" onclick="agregarDigito('1')">1</button> <!-- Botón para el número 1 -->
            <button class="numero" onclick="agregarDigito('2')">2</button> <!-- Botón para el número 2 -->
            <button class="numero" onclick="agregarDigito('3')">3</button> <!-- Botón para el número 3 -->
            <button class="igual" onclick="calcular()">=</button> <!-- Botón igual para calcular resultado -->

            <!-- Fila 5: Botón 0 (que ocupa dos columnas) y punto decimal -->
            <button class="numero" onclick="agregarDigito('0')" style="grid-column: span 2;">0</button>
            <!-- Botón para el número 0 -->
            <button class="numero" onclick="agregarDigito('.')">.</button> <!-- Botón para punto decimal -->
        </div>
    </div>

    <!-- Enlace al archivo JavaScript con la lógica de la calculadora -->
    <script src="asset/js/script.js"></script>
</body>

</html>
